<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="진양 기사앱">
<title>진양로지스틱스 기사앱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#E5E7EB}
a{color:#1E4FD8;text-decoration:none}
*{-webkit-tap-highlight-color:transparent}
#app{min-height:100dvh}
</style>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div style="width: 100%; max-width: 480px; margin: 0 auto; height: 100dvh; position: relative; overflow: hidden; background: #F4F6F9; font-family: 'Noto Sans KR', sans-serif; color: #111827">


<template v-if="v.isLogin">
  <div style="height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 32px 28px; background: #FFFFFF">
    <span style="font-size: 14px; font-weight: 800; color: #1E4FD8; letter-spacing: 1px">JINYANG LOGISTICS</span>
    <h1 style="margin: 0 0 10px; font-size: 26px; font-weight: 800; line-height: 1.4">기사님 전용 앱에<br>오신 걸 환영해요</h1>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lg-phone" style="font-size: 13px; font-weight: 700; color: #374151">휴대폰 번호</label>
      <input id="lg-phone" type="tel" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lg-pw" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호</label>
      <input id="lg-pw" type="password" placeholder="비밀번호" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
    </div>
    <button type="button" @click="v.loginDriver" style="min-height: 52px; border: none; border-radius: 14px; background: #1E4FD8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">로그인</button>
    <button type="button" @click="v.goSignup" style="min-height: 52px; border: 1px solid #1E4FD8; border-radius: 14px; background: #FFFFFF; color: #1E4FD8; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">처음이에요 · 기사 회원가입</button>
    <button type="button" @click="v.loginAdmin" style="min-height: 44px; border: none; background: transparent; color: #374151; font-family: inherit; font-size: 14px; font-weight: 500; text-decoration: underline; cursor: pointer">관리자로 로그인 (체험용)</button>
    <p style="margin: 0; font-size: 12px; color: #4B5563; text-align: center">체험용 목업이라 아무 값이나 넣어도 로그인돼요</p>
    <div style="border-top: 1px solid #E5E7EB; padding-top: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #4B5563">예시 기사 계정으로 보기</span>
      <div style="display: flex; gap: 8px">
        <button type="button" @click="v.loginReduced" style="flex: 1; min-height: 44px; border: 1px solid #FDBA74; border-radius: 12px; background: #FFF7ED; color: #9A3412; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">감차 승인된 기사</button>
        <button type="button" @click="v.loginLease" style="flex: 1; min-height: 44px; border: 1px solid #D1D5DB; border-radius: 12px; background: #F3F4F6; color: #111827; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">넘버 임대 기사</button>
      </div>
    </div>
  </div>
</template>


<template v-if="v.isSignup">
  <div style="height: 100dvh; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 14px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB">
      <button type="button" aria-label="뒤로" @click="v.signupBack" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #111827; cursor: pointer">‹</button>
      <span style="flex: 1; font-size: 17px; font-weight: 700">기사 회원가입</span>
      <span style="font-size: 13px; font-weight: 700; color: #1E4FD8; padding-right: 12px">{{ v.stepText }}</span>
    </div>
    <div style="flex: none; height: 4px; background: #E5E7EB"><div :style="v.stepBar"></div></div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px">
      <template v-if="v.step1">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">기본 정보를 입력해 주세요</h2>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-name" style="font-size: 13px; font-weight: 700; color: #374151">이름 *</label>
            <input id="su-name" type="text" :value="v.form.name" @input="v.on.name" placeholder="실명 입력" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-rrn1" style="font-size: 13px; font-weight: 700; color: #374151">주민등록번호 *</label>
            <div style="display: flex; align-items: center; gap: 8px">
              <input id="su-rrn1" type="text" inputmode="numeric" maxlength="6" :value="v.form.rrn1" @input="v.on.rrn1" placeholder="앞 6자리" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
              <span style="font-size: 18px; color: #4B5563">-</span>
              <input id="su-rrn2" type="password" inputmode="numeric" maxlength="7" aria-label="주민등록번호 뒤 7자리" :value="v.form.rrn2" @input="v.on.rrn2" placeholder="뒤 7자리" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-phone" style="font-size: 13px; font-weight: 700; color: #374151">본폰 *</label>
            <input id="su-phone" type="tel" :value="v.form.phone" @input="v.on.phone" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-sub" style="font-size: 13px; font-weight: 700; color: #374151">서브폰 (선택)</label>
            <input id="su-sub" type="tel" :value="v.form.sub" @input="v.on.sub" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-addr" style="font-size: 13px; font-weight: 700; color: #374151">주소</label>
            <input id="su-addr" type="text" :value="v.form.addr" @input="v.on.addr" placeholder="도로명 주소" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-center" style="font-size: 13px; font-weight: 700; color: #374151">소속센터 *</label>
            <select id="su-center" :value="v.form.center" @change="v.on.center" style="min-height: 48px; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; background: #FFFFFF">
              <option value="">소속센터를 선택하세요</option>
              <option value="진양로지스틱스">진양로지스틱스</option>
              <option value="협력업체A">협력업체A</option>
            </select>
          </div>
          <p style="margin: 0; font-size: 12px; color: #4B5563; line-height: 1.6; background: #EEF2FF; border-radius: 10px; padding: 10px 12px">주민등록번호는 암호화해서 저장되고, 본인과 소속 업체 관리자만 볼 수 있어요.</p>
        </div>
      </template>

      <template v-if="v.step2">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">서류 사진을 첨부해 주세요</h2>
          <p style="margin: 0; font-size: 13px; color: #4B5563">글자가 잘 보이게 찍어 주세요. 나중에 '내 정보'에서 첨부해도 돼요.</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <template v-for="(doc, $index) in v.draftDocs" :key="$index">
              <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
                <div style="height: 92px; border-radius: 10px; background: #F3F4F6; overflow: hidden; display: flex; align-items: center; justify-content: center">
                  <template v-if="doc.isUrl"><img :src="doc.url" alt="{{ doc.label }} 사진" style="width: 100%; height: 92px; object-fit: cover"></template>
                  <template v-if="doc.isSample"><span style="font-size: 12px; color: #374151">사진 첨부됨</span></template>
                  <template v-if="doc.none">
                    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                  </template>
                </div>
                <span style="font-size: 13px; font-weight: 700">{{ doc.label }}</span>
                <span :style="doc.statusStyle">{{ doc.status }}</span>
                <label :for="doc.inputId" style="min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #EEF2FF; color: #1E4FD8; font-size: 13px; font-weight: 700; cursor: pointer">{{ doc.btn }}</label>
                <input :id="doc.inputId" type="file" accept="image/*" @change="doc.onFile" style="display: none">
              </div>
            </template>
          </div>
        </div>
      </template>

      <template v-if="v.step3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 60px; text-align: center">
          <div style="width: 72px; height: 72px; border-radius: 36px; background: #DCFCE7; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
          </div>
          <h2 style="margin: 0; font-size: 22px; font-weight: 800">가입 신청 완료!</h2>
          <p style="margin: 0; font-size: 15px; color: #374151; line-height: 1.6">{{ v.form.center }} 기사 명단에 등록됐어요.<br>관리자가 승인하면 모든 기능을 쓸 수 있어요.</p>
        </div>
      </template>
    </div>

    <div style="flex: none; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #E5E7EB; display: flex; flex-direction: column; gap: 8px">
      <template v-if="v.hasErr"><span role="alert" style="font-size: 13px; font-weight: 700; color: #B91C1C">{{ v.err }}</span></template>
      <button type="button" @click="v.signupNext" style="min-height: 52px; border: none; border-radius: 14px; background: #1E4FD8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{ v.nextLabel }}</button>
    </div>
  </div>
</template>


<template v-if="v.isPick">
  <div style="height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 40px 24px 24px; background: #FFFFFF">
    <span style="font-size: 13px; font-weight: 800; color: #1E4FD8; letter-spacing: 1px">JINYANG LOGISTICS · 관리자</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.4">관리할 업체를<br>선택하세요</h1>
    <p style="margin: 0 0 6px; font-size: 14px; color: #4B5563; line-height: 1.6">업체마다 공지사항, 급여, 팀즈 감지, 기사 정보가 따로 관리돼요.</p>
    <template v-for="(c, $index) in v.companyCards" :key="$index">
      <button type="button" @click="c.pick" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 16px; border: 1px solid #D1D5DB; border-radius: 16px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: #1E4FD8; color: #FFFFFF; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">{{ c.initial }}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 17px; font-weight: 800; color: #111827">{{ c.name }}</span>
          <span style="font-size: 13px; color: #4B5563">{{ c.camp }} · 기사 {{ c.total }}명</span>
          <template v-if="c.hasPending"><span style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #92400E; background: #FEF3C7; padding: 2px 8px; border-radius: 8px">승인 대기 {{ c.pending }}명</span></template>
        </span>
        <span style="font-size: 22px; color: #4B5563">›</span>
      </button>
    </template>
    <button type="button" @click="v.soon" style="min-height: 56px; border: 1px dashed #9CA3AF; border-radius: 16px; background: #FFFFFF; color: #374151; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">+ 업체 추가</button>
    <div style="flex: 1"></div>
    <button type="button" @click="v.logout" style="min-height: 44px; border: none; background: transparent; color: #374151; font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer">로그아웃</button>
  </div>
</template>


<template v-if="v.isApp">
  <div style="height: 100dvh; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; color: #1E4FD8">{{ v.scopeName }}</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 800">{{ v.headerTitle }}</h1>
      </div>
      <template v-if="v.isAdminRole">
        <button type="button" @click="v.goPick" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid #D1D5DB; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; color: #111827; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"></path></svg>
          업체 변경
        </button>
      </template>
      <template v-if="v.isDriverRole">
        <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 12px; background: #E0E7FF; color: #1E3A8A">{{ v.me.name }} 기사</span>
      </template>
    </div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 20px 24px">

      
      <template v-if="v.dHome">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <template v-if="v.me.pending">
            <div style="background: #FEF3C7; border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #78350F; font-weight: 500">관리자 승인 대기 중이에요. 승인되면 알림으로 알려드릴게요.</div>
          </template>
          <span style="font-size: 15px; color: #374151">{{ v.me.name }} 기사님, 안녕하세요</span>
          <template v-if="v.me.rd.approved">
            <div style="background: #FFFFFF; border: 3px solid #EA580C; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; gap: 8px">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
                <span style="font-size: 17px; font-weight: 800; color: #9A3412">감차 승인 확인</span>
              </div>
              <span style="font-size: 14px; color: #374151; line-height: 1.6">{{ v.me.rd.startText }}에 감차가 승인됐어요.<br>승인일부터 60일 동안 의무 근무 기간이에요.</span>
              <div style="background: #FFF7ED; border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 12px; font-weight: 700; color: #9A3412">의무 근무 종료일</span>
                  <span style="font-size: 16px; font-weight: 800">{{ v.me.rd.endText }}</span>
                  <span style="font-size: 12px; color: #374151">{{ v.me.rd.progress }}</span>
                </div>
                <span style="font-size: 26px; font-weight: 800; color: #C2410C">{{ v.me.rd.dday }}</span>
              </div>
              <div style="height: 8px; border-radius: 4px; background: #FED7AA; overflow: hidden"><div :style="v.me.rd.barStyle"></div></div>
              <template v-if="v.me.rd.needAck">
                <button type="button" @click="v.ackReduce" style="min-height: 48px; border: none; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">확인했어요</button>
              </template>
            </div>
          </template>
          <template v-if="v.me.rd.pending">
            <button type="button" @click="v.goMe" style="text-align: left; background: #FFF7ED; border: 1px solid #FDBA74; border-radius: 14px; padding: 12px 14px; font-family: inherit; font-size: 14px; color: #9A3412; font-weight: 700; cursor: pointer">감차 요청 승인 대기 중 · 승인되면 그날부터 60일 카운트가 시작돼요 ›</button>
          </template>
          <template v-if="v.homeNormal">
            <div style="background: #1E4FD8; border-radius: 20px; padding: 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between"><span style="font-size: 14px">11월 정산 · 10/26 ~ 11/25</span><span style="font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 10px">예시</span></div>
              <span style="font-size: 13px">현재까지 예상 지급액</span>
              <span style="font-size: 30px; font-weight: 800">₩3,842,000</span>
              <button type="button" @click="v.goPay" style="align-self: flex-start; min-height: 44px; border: none; background: transparent; padding: 0; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">급여내역 자세히 보기 →</button>
            </div>
          </template>
          <template v-if="v.homeLease">
            <div style="background: #111827; border-radius: 20px; padding: 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between"><span style="font-size: 14px">넘버 임대 기사</span><span style="font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 10px">예시</span></div>
              <span style="font-size: 13px">{{ v.lease.month }} 넘버 임대료</span>
              <span style="font-size: 30px; font-weight: 800">₩{{ v.lease.amountText }}</span>
              <span style="font-size: 13px">납부 기한 {{ v.lease.dueText }} · {{ v.lease.status }}</span>

      markPaid: function () { self.patchDriver(meD.id, { lease: Object.assign({}, meD.lease, { status: '입금 확인 중' }) }); self.flash('입금 확인을 요청했어요'); },
      loginReduced: function () { self.setState({ screen: 'app', role: 'driver', me: 'd4', tab: 'home' }); },
      loginLease: function () { self.setState({ screen: 'app', role: 'driver', me: 'd8', tab: 'home' }); },
      goMe: function () { self.setState({ tab: 'me' }); },
      ackReduce: function () { self.patchDriver(meD.id, { reduce: Object.assign({}, meD.reduce, { ack: true }) }); self.flash('확인했어요. 의무 근무 종료일까지 함께해요'); },
      leaseOpen: s.leaseOpen, leaseForm: s.leaseForm, hasLeaseErr: !!s.leaseErr, leaseErr: s.leaseErr,
      openLease: function () { self.setState({ leaseOpen: true, leaseErr: '', leaseForm: { driverId: null, amount: '', due: iso(eom()), memo: '' } }); },
      closeLease: function () { self.setState({ leaseOpen: false }); },
      onLease: {
        amount: function (e) { self.setState({ leaseErr: '', leaseForm: Object.assign({}, self.state.leaseForm, { amount: e.target.value.replace(/[^0-9]/g, '') }) }); },
        due: function (e) { self.setState({ leaseForm: Object.assign({}, self.state.leaseForm, { due: e.target.value }) }); },
        memo: function (e) { self.setState({ leaseForm: Object.assign({}, self.state.leaseForm, { memo: e.target.value }) }); }
      },
      leasePick: scopeDrivers.filter(function (d) { return d.status !== '승인 대기'; }).map(function (d) {
        var on = s.leaseForm.driverId === d.id;
        return { name: d.name, phone: d.phone, isLease: !!d.lease, on: on, pressed: on ? 'true' : 'false',
          style: { display: 'flex', alignItems: 'center', gap: '10px', minHeight: '56px', padding: '8px 12px', borderRadius: '12px', border: on ? '2px solid #1E4FD8' : '1px solid #E5E7EB', background: on ? '#EEF2FF' : '#FFFFFF', fontFamily: 'inherit', color: '#111827', cursor: 'pointer' },
          pick: function () { self.setState({ leaseErr: '', leaseForm: Object.assign({}, self.state.leaseForm, { driverId: d.id, amount: d.lease ? String(d.lease.amount) : self.state.leaseForm.amount }) }); } };
      }),
      sendLease: function () {
        var f = s.leaseForm;
        if (!f.driverId) { self.setState({ leaseErr: '임대료를 보낼 기사를 선택해 주세요' }); return; }
        if (!f.amount || +f.amount <= 0) { self.setState({ leaseErr: '임대료 금액을 입력해 주세요' }); return; }
        if (!f.due) { self.setState({ leaseErr: '납부 기한을 선택해 주세요' }); return; }
        var d = s.drivers.find(function (x) { return x.id === f.driverId; });
        self.patchDriver(f.driverId, { lease: { amount: +f.amount, due: f.due, memo: f.memo.trim(), status: '납부 대기' } });
        self.setState({ leaseOpen: false });
        self.flash(d.name + ' 기사에게 임대료 안내를 보냈어요 (푸시 발송)');
      },
      payRows: payRows,
      payTotal: won(payRows.reduce(function (a, r) { return a + r.amt; }, 0)),
      goSignup: function () { self.setState({ screen: 'signup', step: 1, form: emptyForm(), err: '' }); },

      step1: s.step === 1, step2: s.step === 2, step3: s.step === 3,
      stepText: s.step + ' / 3',
      stepBar: { width: (s.step * 100 / 3) + '%', height: '4px', background: '#1E4FD8' },
      nextLabel: s.step === 1 ? '다음' : (s.step === 2 ? '가입 신청하기' : '앱 시작하기'),
      form: s.form,
      on: { name: mkSet('name'), rrn1: mkSet('rrn1'), rrn2: mkSet('rrn2'), phone: mkSet('phone'), sub: mkSet('sub'), addr: mkSet('addr'), center: mkSet('center') },
      draftDocs: this.docItems(s.form.docs, 'su', function (k, v) { self.setFormDoc(k, v); }),
      hasErr: !!s.err, err: s.err,
      signupBack: function () {
        if (s.step === 2) self.setState({ step: 1 });
        else if (s.step === 1) self.setState({ screen: 'login' });
      },
      signupNext: function () {
        var f = s.form;
        if (s.step === 1) {
          if (!f.name.trim() || f.rrn1.length < 6 || f.rrn2.length < 7 || !f.phone.trim() || !f.center) {
            self.setState({ err: '이름, 주민번호(13자리), 본폰, 소속센터는 꼭 입력해 주세요' });
            return;
          }
          self.setState({ step: 2, err: '' });
        } else if (s.step === 2) {
          var id = 'n' + Date.now();
          var d = { id: id, name: f.name.trim(), rrn: f.rrn1 + '-' + f.rrn2, phone: f.phone.trim(), sub: f.sub.trim(), addr: f.addr.trim(), center: f.center, status: '승인 대기', docs: Object.assign({}, f.docs) };
          self.setState({ drivers: s.drivers.concat([d]), me: id, step: 3 });
        } else {
          self.setState({ screen: 'app', role: 'driver', tab: 'me' });
          self.flash('가입 신청이 접수됐어요');
        }
      },

      headerTitle: titles[s.tab],
      roleBadge: isDriver ? meD.center : '관리자',
      roleBadgeStyle: { fontSize: '12px', fontWeight: 700, padding: '5px 10px', borderRadius: '12px', background: isDriver ? '#E0E7FF' : '#111827', color: isDriver ? '#1E3A8A' : '#FFFFFF' },
      tabs: tabs,

      dHome: isDriver && s.tab === 'home',
      aHome: !isDriver && s.tab === 'home',
      tNotice: s.tab === 'notice', tTeams: s.tab === 'teams',
      tMe: isDriver && s.tab === 'me',
      sMenu: !isDriver && s.tab === 'settings' && s.adminView === 'menu',
      sList: !isDriver && s.tab === 'settings' && s.adminView === 'list',
      sDetail: !isDriver && s.tab === 'settings' && s.adminView === 'detail' && !!sel,

      goPay: function () { self.setState({ tab: 'pay' }); },
      goTeams: function () { self.setState({ tab: 'teams' }); },
      goNotice: function () { self.setState({ tab: 'notice' }); },
      goMenu: function () { self.setState({ adminView: 'menu' }); },
      goDriverList: function () { self.setState({ tab: 'settings', adminView: 'list', showRrn: false }); },
      soon: function () { self.flash('다음 단계에서 만들 화면이에요'); },
      logout: function () { self.setState({ screen: 'login', editMe: false, showRrn: false }); },

      noticeOk: ok, noticeNotOk: !ok, readCount: Math.max(0, scopeDrivers.length - 2) + (ok ? 1 : 0),
      confirmNotice: function () { var m = Object.assign({}, s.noticeOk); m[scope] = true; self.setState({ noticeOk: m }); },

      pushAria: s.pushOn ? 'true' : 'false',
      togglePush: function () { self.setState({ pushOn: !s.pushOn }); },
      switchStyle: { width: '52px', height: '32px', borderRadius: '16px', border: 'none', padding: '3px', cursor: 'pointer', background: s.pushOn ? '#1E4FD8' : '#9CA3AF', display: 'flex', justifyContent: s.pushOn ? 'flex-end' : 'flex-start', alignItems: 'center' },
      knobStyle: { width: '26px', height: '26px', borderRadius: '13px', background: '#FFFFFF', display: 'block' },

      me: this.view(meD),
      meDocs: this.docItems(meD.docs, 'me', function (k, v) { self.setDriverDoc(meD.id, k, v); self.flash('서류 사진이 저장됐어요'); }),
      editMe: s.editMe, viewMode: !s.editMe,
      editLabel: s.editMe ? '저장' : '수정',
      toggleEdit: function () {
        if (s.editMe) { self.setState({ editMe: false }); self.flash('내 정보가 저장됐어요'); }
        else self.setState({ editMe: true });
      },
      onMe: { phone: mkMe('phone'), sub: mkMe('sub'), addr: mkMe('addr') },
      rrnBtn: s.showRrn ? '숨기기' : '보기',
      toggleRrn: function () { self.setState({ showRrn: !s.showRrn }); },

      company: s.company,
      onCompany: function (e) { self.setState({ company: e.target.value, search: '' }); },
      search: s.search,
      onSearch: function (e) { self.setState({ search: e.target.value }); },
      stats: stats, rows: rows, noRows: rows.length === 0,
      pendingRows: pendingRows, noPending: pendingRows.length === 0,

      sel: sel ? this.view(sel) : { name: '', initial: '', center: '', status: '', pending: false, phone: '', subText: '', addrText: '', rrnShown: '', docText: '', rd: reduceView(null) },
      selDocs: sel ? this.docItems(sel.docs, 'sel', null) : [],
      approve: function () { if (sel) { self.patchDriver(sel.id, { status: '활성' }); self.flash(sel.name + ' 기사 가입을 승인했어요'); } },
      requestDocs: function () { self.flash('미제출 서류 첨부 요청 알림을 보냈어요'); },

      reduceRows: reduceRows, noReduce: reduceRows.length === 0,
      showReduceBtn: !meD.reduce || meD.reduce.status === '반려',
      reduceOpen: s.reduceOpen,
      reqPreview: fmtDate(today0()), endPreview: fmtDate(addDays(today0(), 60)),
      openReduce: function () { self.setState({ reduceOpen: true }); },
      closeReduce: function () { self.setState({ reduceOpen: false }); },
      submitReduce: function () {
        self.patchDriver(meD.id, { reduce: { req: today0().getTime(), status: '요청' } });
        self.setState({ reduceOpen: false });
        self.flash('감차 요청 접수 · 승인되면 그날부터 60일 카운트돼요');
      },
      approveReduce: function () {
        if (!sel || !sel.reduce) return;
        self.patchDriver(sel.id, { reduce: Object.assign({}, sel.reduce, { status: '승인', approvedAt: today0().getTime(), ack: false }) });
        self.flash(sel.name + ' 기사 감차 승인 · 오늘부터 60일 카운트 시작');
      },
      rejectReduce: function () {
        if (!sel || !sel.reduce) return;
        self.patchDriver(sel.id, { reduce: Object.assign({}, sel.reduce, { status: '반려' }) });
        self.flash(sel.name + ' 기사 감차 요청을 반려했어요');
      },

      hasToast: !!s.toast, toast: s.toast
    };
  }
}

(function () {
  var comp = new Component({});
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  comp.state = Vue.reactive(comp.state);
  var app = Vue.createApp({
    template: '#tpl',
    setup: function () {
      var v = Vue.computed(function () { return comp.renderVals(); });
      Vue.onMounted(function () {
        if (saved && saved.drivers) { Object.assign(comp.state, saved); }
        else if (comp.componentDidMount) { comp.componentDidMount(); }
      });
      return { v: v };
    }
  });
  app.mount('#app');
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
