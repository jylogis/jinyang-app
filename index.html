<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="진양 기사앱">
<title>진양로지스틱스 기사앱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0B1533;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:#1E4FD8;text-decoration:none}
*{-webkit-tap-highlight-color:transparent}
#app{min-height:100dvh}
/* ---------- 진양 테마: 네이비 + 골드 ---------- */
.jy-root{background:radial-gradient(1200px 500px at 110% -10%,#E7ECFF 0%,rgba(231,236,255,0) 60%),radial-gradient(900px 400px at -20% 110%,#FFF6E0 0%,rgba(255,246,224,0) 55%),#F3F5FA !important;letter-spacing:-0.01em}
.jy-root *{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif}
.jy-root button,.jy-root input,.jy-root select,.jy-root textarea{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif !important}
.jy-root [style*="background: #FFFFFF"][style*="border-radius: 16px"],
.jy-root [style*="background: #FFFFFF"][style*="border-radius: 14px"]{box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.22) !important;border-color:rgba(15,23,42,.06)}
.jy-root button[style*="background: #1E4FD8"]{background:linear-gradient(135deg,#4F6BFF 0%,#2337B8 100%) !important;box-shadow:0 10px 20px -10px rgba(35,55,184,.75) !important}
.jy-root button[style*="background: #111827"]{background:linear-gradient(135deg,#1F2A44 0%,#0B1533 100%) !important;box-shadow:0 10px 20px -10px rgba(11,21,51,.8) !important}
.jy-root button[style*="background: #C2410C"]{background:linear-gradient(135deg,#F97316 0%,#C2410C 100%) !important}
.jy-root div[style*="background: #1E4FD8"][style*="border-radius: 20px"],.jy-root div[style*="background: #1E4FD8"][style*="border-radius: 18px"]{background:linear-gradient(135deg,#3B5BFD 0%,#1E2E9E 70%,#172554 100%) !important;box-shadow:0 18px 34px -18px rgba(30,46,158,.8) !important;position:relative;overflow:hidden}
.jy-root div[style*="background: #111827"][style*="border-radius"]{background:linear-gradient(135deg,#1F2A44 0%,#0B1533 100%) !important}
.jy-root input:not([type=checkbox]):not([type=file]),.jy-root select,.jy-root textarea{background-color:#F8FAFD !important;transition:border-color .15s,box-shadow .15s}
.jy-root input:focus,.jy-root select:focus,.jy-root textarea:focus{outline:none;border-color:#4F6BFF !important;box-shadow:0 0 0 4px rgba(79,107,255,.15)}
.jy-root button{transition:transform .08s ease,filter .15s}
.jy-root button:active{transform:scale(.98)}
.jy-root button:disabled{filter:saturate(.6) opacity(.75)}
.jy-root .jy-step button:disabled{filter:none}
.e3d{object-fit:contain;flex:none;filter:drop-shadow(0 4px 6px rgba(15,23,42,.18))}
.jy-head{background:linear-gradient(135deg,#0B1533 0%,#14245A 55%,#1E3A8A 100%);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 12px 30px -18px rgba(11,21,51,.9);position:relative;overflow:hidden}
.jy-head:after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.28),rgba(212,175,55,0) 70%)}
.jy-gold{background:linear-gradient(110deg,#BF953F,#FCF6BA 40%,#B38728 70%,#FBF5B7);-webkit-background-clip:text;background-clip:text;color:transparent}
.jy-nav{background:rgba(255,255,255,.92) !important;backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid rgba(15,23,42,.06) !important;box-shadow:0 -8px 24px -18px rgba(15,23,42,.35)}
.jy-pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;font-weight:800;padding:4px 10px 4px 6px;border-radius:999px}
.jy-time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;color:#0B1533;white-space:nowrap}
.jy-step{min-width:0}
.jy-step *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jy-login{background:radial-gradient(700px 380px at 50% -10%,rgba(212,175,55,.22),rgba(212,175,55,0) 60%),linear-gradient(180deg,#0B1533 0%,#0A0F1F 100%) !important;color:#fff}
.jy-login label{color:#CBD5E1 !important}
.jy-login input{background:#FFFFFF !important;border-color:rgba(255,255,255,.2) !important}
.jy-co{position:relative;height:28px;min-width:40px;max-width:46vw;padding:0 11px;box-sizing:border-box;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(135deg,#2A3FC4 0%,#14245A 55%,#0B1533 100%);
  box-shadow:0 0 0 2px rgba(212,175,55,.9),0 10px 20px -10px rgba(0,0,0,.7);
  animation:jyCoIn .7s cubic-bezier(.2,.8,.2,1) both,jyCoGlow 3.2s ease-in-out .7s infinite}
.jy-co:after{content:"";position:absolute;top:-50%;bottom:-50%;width:45%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:jySheen 3.6s ease-in-out 1.2s infinite}
.jy-co-t{position:relative;z-index:1;font-size:12.5px;font-weight:900;line-height:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:linear-gradient(135deg,#FCF6BA 0%,#D4AF37 45%,#FBF5B7 70%,#B38728 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes jyCoIn{from{opacity:0;transform:scale(.55) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes jyCoGlow{0%,100%{box-shadow:0 0 0 2px rgba(212,175,55,.9),0 10px 20px -10px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 2px rgba(252,246,186,1),0 0 20px 3px rgba(212,175,55,.5)}}
@keyframes jySheen{0%{left:-60%}55%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){.jy-co,.jy-co:after{animation:none}}
.jy-switch{width:52px;height:30px;border-radius:15px;border:none;padding:3px;cursor:pointer;display:flex;align-items:center;transition:background .2s}

.jy-splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s ease;overflow:hidden}
.jy-out{opacity:0;pointer-events:none}
.jy-gold{background:linear-gradient(110deg,#7a5a12 0%,#bf953f 18%,#fcf6ba 32%,#b38728 46%,#fbf5b7 60%,#aa771c 76%,#7a5a12 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.jy-title{font-family:'Cinzel',serif;font-size:clamp(44px,13vw,72px);font-weight:700;letter-spacing:.06em;line-height:1;
  background:linear-gradient(110deg,#7a5a12 0%,#bf953f 18%,#fcf6ba 32%,#b38728 46%,#fbf5b7 60%,#aa771c 76%,#7a5a12 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:jyIn 1.2s cubic-bezier(.2,.7,.2,1) both,jyShine 2.6s linear .5s infinite;filter:drop-shadow(0 0 18px rgba(212,175,55,.25))}
.jy-sub{font-family:'Cinzel',serif;font-size:clamp(15px,4.2vw,20px);font-weight:500;letter-spacing:.6em;padding-left:.6em;text-transform:lowercase;
  background:linear-gradient(110deg,#7a5a12 0%,#bf953f 18%,#fcf6ba 32%,#b38728 46%,#fbf5b7 60%,#aa771c 76%,#7a5a12 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:jySub 1.1s ease .75s both,jyShine 2.6s linear .9s infinite}
.jy-line{width:0;height:1px;background:linear-gradient(90deg,transparent,#d4af37,#fcf6ba,#d4af37,transparent);animation:jyLine 1s cubic-bezier(.2,.7,.2,1) .45s forwards}
.jy-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.18) 0%,rgba(212,175,55,0) 65%);animation:jyGlow 3s ease-in-out infinite}
@keyframes jyIn{from{opacity:0;transform:translateY(16px) scale(.97);letter-spacing:.32em;filter:blur(8px)}to{opacity:1;transform:none;letter-spacing:.06em;filter:drop-shadow(0 0 18px rgba(212,175,55,.25))}}
@keyframes jySub{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes jyShine{from{background-position:200% 0}to{background-position:-50% 0}}
@keyframes jyLine{to{width:min(220px,55vw)}}
@keyframes jyGlow{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.jy-title,.jy-sub,.jy-line,.jy-glow{animation:none}.jy-line{width:min(220px,55vw)}}
</style>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="jy-root" style="width: 100%; max-width: 480px; margin: 0 auto; height: 100dvh; position: relative; overflow: hidden; background: #F4F6F9; color: #0F172A">


<template v-if="v.splash">
  <div class="jy-splash" :class="{ 'jy-out': v.splashOut }" role="img" aria-label="Jin Yang logistics">
    <div class="jy-glow" aria-hidden="true"></div>
    <div class="jy-title" aria-hidden="true">Jin Yang</div>
    <div class="jy-line" aria-hidden="true"></div>
    <div class="jy-sub" aria-hidden="true">logistics</div>
  </div>
</template>

<template v-if="v.isBoot"><div style="height: 100dvh; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #4B5563">불러오는 중…</div></template>

<template v-if="v.isLogin">
  <div class="jy-login" style="height: 100dvh; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 32px 28px; background: #FFFFFF">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-bottom: 6px"><span class="jy-gold" style="font-family: 'Cinzel', serif; font-size: 34px; font-weight: 700; letter-spacing: .04em; line-height: 1.1">Jin Yang</span><span class="jy-gold" style="font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: .5em">logistics</span></div>
    <h1 style="margin: 6px 0 8px; font-size: 24px; font-weight: 800; line-height: 1.4; color: #FFFFFF">기사님 전용 앱에<br>오신 걸 환영해요 <img :src="v.emo.wave" alt="" aria-hidden="true" class="e3d" style="width: 30px; height: 30px; vertical-align: -6px"></h1>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lg-phone" style="font-size: 13px; font-weight: 700; color: #374151">아이디 또는 휴대폰 번호</label>
      <input id="lg-phone" type="text" autocapitalize="off" autocomplete="username" :value="v.login.phone" @input="v.onLogin.phone" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lg-pw" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호</label>
      <input id="lg-pw" type="password" :value="v.login.pw" @input="v.onLogin.pw" @keyup.enter="v.doLogin" placeholder="비밀번호" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
    </div>
    <button type="button" @click="v.doLogin" :disabled="v.busy" style="min-height: 54px; border: none; border-radius: 16px; background: linear-gradient(135deg,#F7E7A1 0%,#D4AF37 45%,#A8801F 100%); color: #1A1305; box-shadow: 0 12px 26px -12px rgba(212,175,55,.8); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{ v.busy ? '확인 중…' : '로그인' }}</button>
    <button type="button" @click="v.goSignup" style="min-height: 52px; border: 1px solid rgba(255,255,255,.35); border-radius: 16px; background: rgba(255,255,255,.06); color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">처음이에요 · 기사 회원가입</button>
    <template v-if="v.loginErr"><span role="alert" style="font-size: 13px; font-weight: 700; color: #FCA5A5; text-align: center">{{ v.loginErr }}</span></template>
  </div>
</template>



<template v-if="v.isSignup">
  <div style="height: 100dvh; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 14px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB">
      <button type="button" aria-label="뒤로" @click="v.signupBack" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #111827; cursor: pointer">‹</button>
      <span style="flex: 1; font-size: 17px; font-weight: 700">기사 회원가입</span>
      <span style="font-size: 13px; font-weight: 700; color: #1E4FD8; padding-right: 12px">{{ v.stepText }}</span>
    </div>
    <div style="flex: none; height: 4px; background: #E5E7EB"><div :style="v.stepBar"></div></div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px">
      <template v-if="v.step1">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">기본 정보를 입력해 주세요</h2>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-name" style="font-size: 13px; font-weight: 700; color: #374151">이름 *</label>
            <input id="su-name" type="text" :value="v.form.name" @input="v.on.name" placeholder="실명 입력" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-rrn1" style="font-size: 13px; font-weight: 700; color: #374151">주민등록번호 *</label>
            <div style="display: flex; align-items: center; gap: 8px">
              <input id="su-rrn1" type="text" inputmode="numeric" maxlength="6" :value="v.form.rrn1" @input="v.on.rrn1" placeholder="앞 6자리" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
              <span style="font-size: 18px; color: #4B5563">-</span>
              <input id="su-rrn2" type="password" inputmode="numeric" maxlength="7" aria-label="주민등록번호 뒤 7자리" :value="v.form.rrn2" @input="v.on.rrn2" placeholder="뒤 7자리" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-phone" style="font-size: 13px; font-weight: 700; color: #374151">본폰 * (로그인 아이디로 써요)</label>
            <input id="su-phone" type="tel" :value="v.form.phone" @input="v.on.phone" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-pw" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호 * (6자리 이상)</label>
            <input id="su-pw" type="password" :value="v.form.pw" @input="v.on.pw" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-pw2" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호 확인 *</label>
            <input id="su-pw2" type="password" :value="v.form.pw2" @input="v.on.pw2" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-sub" style="font-size: 13px; font-weight: 700; color: #374151">서브폰 (선택)</label>
            <input id="su-sub" type="tel" :value="v.form.sub" @input="v.on.sub" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-addr" style="font-size: 13px; font-weight: 700; color: #374151">주소</label>
            <input id="su-addr" type="text" :value="v.form.addr" @input="v.on.addr" placeholder="도로명 주소" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-center" style="font-size: 13px; font-weight: 700; color: #374151">소속센터 *</label>
            <select id="su-center" :value="v.form.center" @change="v.on.center" style="min-height: 48px; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; background: #FFFFFF">
              <option value="">소속센터를 선택하세요</option>
              <option v-for="c in v.companyOptions" :key="c.id" :value="c.id">{{ c.name }}</option>
            </select>
          </div>
          <p style="margin: 0; font-size: 12px; color: #4B5563; line-height: 1.6; background: #EEF2FF; border-radius: 10px; padding: 10px 12px">주민등록번호는 암호화해서 저장되고, 본인과 소속 업체 관리자만 볼 수 있어요.</p>
        </div>
      </template>

      <template v-if="v.step2">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">서류 사진을 첨부해 주세요</h2>
          <p style="margin: 0; font-size: 13px; color: #4B5563">글자가 잘 보이게 찍어 주세요. 나중에 '내 정보'에서 첨부해도 돼요.</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <template v-for="(doc, $index) in v.draftDocs" :key="$index">
              <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
                <div style="height: 92px; border-radius: 10px; background: #F3F4F6; overflow: hidden; display: flex; align-items: center; justify-content: center">
                  <template v-if="doc.isUrl"><img :src="doc.url" :alt="doc.label + ' 사진'" style="width: 100%; height: 92px; object-fit: cover"></template>
                  <template v-if="doc.isSample"><span style="font-size: 12px; color: #374151">사진 첨부됨</span></template>
                  <template v-if="doc.none">
                    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                  </template>
                </div>
                <span style="font-size: 13px; font-weight: 700">{{ doc.label }}</span>
                <span :style="doc.statusStyle">{{ doc.status }}</span>
                <label :for="doc.inputId" style="min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #EEF2FF; color: #1E4FD8; font-size: 13px; font-weight: 700; cursor: pointer">{{ doc.btn }}</label>
                <input :id="doc.inputId" type="file" accept="image/*" @change="doc.onFile" style="display: none">
              </div>
            </template>
          </div>
        </div>
      </template>

      <template v-if="v.step3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 60px; text-align: center">

    dispOpen: s.dispOpen, dispForm: s.dispForm, dispErr: s.dispErr,
    routeOptions: scopeRoutes.map(function (r) { return { id: r.id, label: r.name + (r.fee ? ' · ' + won(r.fee) + '원' : '') }; }),
    driverOptions: scopeDrivers.map(function (d) { return { id: d.id, label: d.name + ' ' + (d.rank || '기사') + (d.status === '승인 대기' ? ' (승인 대기)' : '') }; }),
    openDispAdd: function () { S.dispErr = ''; S.dispForm = { id: null, work_date: S.dispDate, route_id: '', driver_id: '', fee: '', memo: '' }; S.dispOpen = true; },
    closeDisp: function () { S.dispOpen = false; },
    onDisp: {
      work_date: setF(s.dispForm, 'work_date'), fee: setF(s.dispForm, 'fee', digits), memo: setF(s.dispForm, 'memo'), driver_id: setF(s.dispForm, 'driver_id'),
      route_id: function (e) {
        var old = S.routes.find(function (r) { return r.id === S.dispForm.route_id; });
        var nw = S.routes.find(function (r) { return r.id === e.target.value; });
        S.dispForm.route_id = e.target.value;
        if (nw && (!S.dispForm.fee || (old && String(old.fee) === S.dispForm.fee))) S.dispForm.fee = String(nw.fee || '');
      }
    },
    saveDisp: function () {
      var f = S.dispForm, r = S.routes.find(function (x) { return x.id === f.route_id; });
      if (!f.work_date) { S.dispErr = '날짜를 선택해 주세요'; return; }
      if (!r) { S.dispErr = '노선을 선택해 주세요'; return; }
      var row = { company_id: S.company, route_id: r.id, route_name: r.name, driver_id: f.driver_id || null, work_date: f.work_date, fee: +(f.fee || 0), memo: f.memo.trim() };
      run(async function () {
        try {
          if (f.id) await q(sb.from('dispatches').update(row).eq('id', f.id));
          else await q(sb.from('dispatches').insert(row));
          S.dispOpen = false; S.dispDate = f.work_date; await loadDispatches();
          flash(f.id ? '배차를 수정했어요' : r.name + ' 배차를 추가했어요');
        } catch (e) { fail(e, '배차를 저장하지 못했어요'); }
      });
    },

    // 노선 설정
    sRoutes: !isDriver && s.tab === 'settings' && s.adminView === 'routes',
    goRoutes: function () { S.adminView = 'routes'; S.routeForm = { id: null, name: '', fee: '', memo: '' }; S.routeErr = ''; S.routeDel = null; },
    routeForm: s.routeForm, routeErr: s.routeErr,
    onRoute: { name: setF(s.routeForm, 'name'), fee: setF(s.routeForm, 'fee', digits), memo: setF(s.routeForm, 'memo') },
    cancelRoute: function () { S.routeForm = { id: null, name: '', fee: '', memo: '' }; S.routeErr = ''; },
    saveRoute: function () {
      var f = S.routeForm, name = f.name.trim();
      if (!name) { S.routeErr = '노선 이름을 입력해 주세요'; return; }
      var row = { company_id: S.company, name: name, fee: +(f.fee || 0), memo: f.memo.trim() };
      run(async function () {
        try {
          if (f.id) await q(sb.from('routes').update(row).eq('id', f.id));
          else await q(sb.from('routes').insert(row));
          S.routeForm = { id: null, name: '', fee: '', memo: '' }; S.routeErr = '';
          S.routes = await q(sb.from('routes').select('*').order('sort').order('name'));
          flash(f.id ? name + ' 노선을 수정했어요' : name + ' 노선을 추가했어요');
        } catch (e) { S.routeErr = /duplicate|unique/i.test(e.message || '') ? '같은 이름의 노선이 이미 있어요' : '저장하지 못했어요'; }
      });
    },
    routeRows: scopeRoutes.map(function (r, i) {
      return { id: r.id, name: r.name, memo: r.memo, feeText: won(r.fee) + '원', delAsk: s.routeDel === r.id,
        rowStyle: { display: 'flex', alignItems: 'center', gap: '8px', minHeight: '64px', borderTop: i === 0 ? 'none' : '1px solid #E5E7EB' },
        edit: function () { S.routeForm = { id: r.id, name: r.name, fee: String(r.fee || ''), memo: r.memo || '' }; S.routeErr = ''; },
        askDel: function () { S.routeDel = r.id; },
        del: function () {
          run(async function () {
            try { await q(sb.from('routes').delete().eq('id', r.id)); S.routeDel = null; S.routes = await q(sb.from('routes').select('*').order('sort').order('name')); flash(r.name + ' 노선을 삭제했어요'); }
            catch (e) { fail(e, '삭제하지 못했어요'); }
          });
        } };
    }),

    hasToast: !!s.toast, toast: s.toast
  };
}

Vue.createApp({
  template: '#tpl',
  setup: function () {
    var v = Vue.computed(build);
    Vue.onMounted(boot);
    return { v: v };
  }
}).mount('#app');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
