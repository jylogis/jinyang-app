<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4FD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="진양 기사앱">
<title>진양로지스틱스 기사앱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#E5E7EB}
a{color:#1E4FD8;text-decoration:none}
*{-webkit-tap-highlight-color:transparent}
#app{min-height:100dvh}
</style>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div style="width: 100%; max-width: 480px; margin: 0 auto; height: 100dvh; position: relative; overflow: hidden; background: #F4F6F9; font-family: 'Noto Sans KR', sans-serif; color: #111827">


<template v-if="v.isBoot"><div style="height: 100dvh; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #4B5563">불러오는 중…</div></template>

<template v-if="v.isLogin">
  <div style="height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 32px 28px; background: #FFFFFF">
    <span style="font-size: 14px; font-weight: 800; color: #1E4FD8; letter-spacing: 1px">JINYANG LOGISTICS</span>
    <h1 style="margin: 0 0 10px; font-size: 26px; font-weight: 800; line-height: 1.4">기사님 전용 앱에<br>오신 걸 환영해요</h1>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lg-phone" style="font-size: 13px; font-weight: 700; color: #374151">휴대폰 번호</label>
      <input id="lg-phone" type="tel" inputmode="numeric" :value="v.login.phone" @input="v.onLogin.phone" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="lg-pw" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호</label>
      <input id="lg-pw" type="password" :value="v.login.pw" @input="v.onLogin.pw" @keyup.enter="v.doLogin" placeholder="비밀번호" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
    </div>
    <button type="button" @click="v.doLogin" :disabled="v.busy" style="min-height: 52px; border: none; border-radius: 14px; background: #1E4FD8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{ v.busy ? '확인 중…' : '로그인' }}</button>
    <button type="button" @click="v.goSignup" style="min-height: 52px; border: 1px solid #1E4FD8; border-radius: 14px; background: #FFFFFF; color: #1E4FD8; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">처음이에요 · 기사 회원가입</button>
    <template v-if="v.loginErr"><span role="alert" style="font-size: 13px; font-weight: 700; color: #B91C1C; text-align: center">{{ v.loginErr }}</span></template>
    <button type="button" @click="v.goAdminSignup" style="min-height: 44px; border: none; background: transparent; color: #374151; font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer">관리자 계정 만들기</button>
  </div>
</template>

<template v-if="v.isAdminSignup">
  <div style="height: 100dvh; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 20px 28px 32px; background: #FFFFFF">
    <button type="button" @click="v.backToLogin" style="align-self: flex-start; min-height: 44px; border: none; background: transparent; padding: 0; font-family: inherit; font-size: 15px; color: #374151; cursor: pointer">‹ 로그인으로</button>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800">관리자 계정 만들기</h1>
    <p style="margin: 0; font-size: 14px; color: #4B5563; line-height: 1.6">관리자로 등록된 전화번호로만 만들 수 있어요.</p>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="ad-name" style="font-size: 13px; font-weight: 700; color: #374151">이름</label><input id="ad-name" type="text" :value="v.adminForm.name" @input="v.onAdmin.name" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px"></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="ad-phone" style="font-size: 13px; font-weight: 700; color: #374151">휴대폰 번호 (로그인 아이디)</label><input id="ad-phone" type="tel" inputmode="numeric" :value="v.adminForm.phone" @input="v.onAdmin.phone" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px"></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="ad-pw" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호 (6자리 이상)</label><input id="ad-pw" type="password" :value="v.adminForm.pw" @input="v.onAdmin.pw" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px"></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="ad-pw2" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호 확인</label><input id="ad-pw2" type="password" :value="v.adminForm.pw2" @input="v.onAdmin.pw2" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px"></div>
    <template v-if="v.adminErr"><span role="alert" style="font-size: 13px; font-weight: 700; color: #B91C1C">{{ v.adminErr }}</span></template>
    <button type="button" @click="v.doAdminSignup" :disabled="v.busy" style="min-height: 52px; border: none; border-radius: 14px; background: #111827; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">관리자 계정 만들기</button>
  </div>
</template>


<template v-if="v.isSignup">
  <div style="height: 100dvh; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; align-items: center; gap: 4px; padding: 14px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB">
      <button type="button" aria-label="뒤로" @click="v.signupBack" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #111827; cursor: pointer">‹</button>
      <span style="flex: 1; font-size: 17px; font-weight: 700">기사 회원가입</span>
      <span style="font-size: 13px; font-weight: 700; color: #1E4FD8; padding-right: 12px">{{ v.stepText }}</span>
    </div>
    <div style="flex: none; height: 4px; background: #E5E7EB"><div :style="v.stepBar"></div></div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px">
      <template v-if="v.step1">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">기본 정보를 입력해 주세요</h2>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-name" style="font-size: 13px; font-weight: 700; color: #374151">이름 *</label>
            <input id="su-name" type="text" :value="v.form.name" @input="v.on.name" placeholder="실명 입력" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-rrn1" style="font-size: 13px; font-weight: 700; color: #374151">주민등록번호 *</label>
            <div style="display: flex; align-items: center; gap: 8px">
              <input id="su-rrn1" type="text" inputmode="numeric" maxlength="6" :value="v.form.rrn1" @input="v.on.rrn1" placeholder="앞 6자리" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
              <span style="font-size: 18px; color: #4B5563">-</span>
              <input id="su-rrn2" type="password" inputmode="numeric" maxlength="7" aria-label="주민등록번호 뒤 7자리" :value="v.form.rrn2" @input="v.on.rrn2" placeholder="뒤 7자리" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-phone" style="font-size: 13px; font-weight: 700; color: #374151">본폰 * (로그인 아이디로 써요)</label>
            <input id="su-phone" type="tel" :value="v.form.phone" @input="v.on.phone" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-pw" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호 * (6자리 이상)</label>
            <input id="su-pw" type="password" :value="v.form.pw" @input="v.on.pw" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-pw2" style="font-size: 13px; font-weight: 700; color: #374151">비밀번호 확인 *</label>
            <input id="su-pw2" type="password" :value="v.form.pw2" @input="v.on.pw2" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-sub" style="font-size: 13px; font-weight: 700; color: #374151">서브폰 (선택)</label>
            <input id="su-sub" type="tel" :value="v.form.sub" @input="v.on.sub" placeholder="010-0000-0000" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-addr" style="font-size: 13px; font-weight: 700; color: #374151">주소</label>
            <input id="su-addr" type="text" :value="v.form.addr" @input="v.on.addr" placeholder="도로명 주소" style="min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="su-center" style="font-size: 13px; font-weight: 700; color: #374151">소속센터 *</label>
            <select id="su-center" :value="v.form.center" @change="v.on.center" style="min-height: 48px; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; background: #FFFFFF">
              <option value="">소속센터를 선택하세요</option>
              <option v-for="c in v.companyOptions" :key="c.id" :value="c.id">{{ c.name }}</option>
            </select>
          </div>
          <p style="margin: 0; font-size: 12px; color: #4B5563; line-height: 1.6; background: #EEF2FF; border-radius: 10px; padding: 10px 12px">주민등록번호는 암호화해서 저장되고, 본인과 소속 업체 관리자만 볼 수 있어요.</p>
        </div>
      </template>

      <template v-if="v.step2">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">서류 사진을 첨부해 주세요</h2>
          <p style="margin: 0; font-size: 13px; color: #4B5563">글자가 잘 보이게 찍어 주세요. 나중에 '내 정보'에서 첨부해도 돼요.</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <template v-for="(doc, $index) in v.draftDocs" :key="$index">
              <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
                <div style="height: 92px; border-radius: 10px; background: #F3F4F6; overflow: hidden; display: flex; align-items: center; justify-content: center">
                  <template v-if="doc.isUrl"><img :src="doc.url" alt="{{ doc.label }} 사진" style="width: 100%; height: 92px; object-fit: cover"></template>
                  <template v-if="doc.isSample"><span style="font-size: 12px; color: #374151">사진 첨부됨</span></template>
                  <template v-if="doc.none">
                    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                  </template>
                </div>
                <span style="font-size: 13px; font-weight: 700">{{ doc.label }}</span>
                <span :style="doc.statusStyle">{{ doc.status }}</span>
                <label :for="doc.inputId" style="min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #EEF2FF; color: #1E4FD8; font-size: 13px; font-weight: 700; cursor: pointer">{{ doc.btn }}</label>
                <input :id="doc.inputId" type="file" accept="image/*" @change="doc.onFile" style="display: none">
              </div>
            </template>
          </div>
        </div>
      </template>

      <template v-if="v.step3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 60px; text-align: center">
          <div style="width: 72px; height: 72px; border-radius: 36px; background: #DCFCE7; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
          </div>
          <h2 style="margin: 0; font-size: 22px; font-weight: 800">가입 신청 완료!</h2>
          <p style="margin: 0; font-size: 15px; color: #374151; line-height: 1.6">{{ v.form.centerName }} 기사 명단에 등록됐어요.<br>관리자가 승인하면 모든 기능을 쓸 수 있어요.</p>
        </div>
      </template>
    </div>

    <div style="flex: none; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #E5E7EB; display: flex; flex-direction: column; gap: 8px">
      <template v-if="v.hasErr"><span role="alert" style="font-size: 13px; font-weight: 700; color: #B91C1C">{{ v.err }}</span></template>
      <button type="button" @click="v.signupNext" style="min-height: 52px; border: none; border-radius: 14px; background: #1E4FD8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{ v.busy ? '저장 중…' : v.nextLabel }}</button>
    </div>
  </div>
</template>


<template v-if="v.isPick">
  <div style="height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 40px 24px 24px; background: #FFFFFF">
    <span style="font-size: 13px; font-weight: 800; color: #1E4FD8; letter-spacing: 1px">JINYANG LOGISTICS · 관리자</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.4">관리할 업체를<br>선택하세요</h1>
    <p style="margin: 0 0 6px; font-size: 14px; color: #4B5563; line-height: 1.6">업체마다 공지사항, 급여, 팀즈 감지, 기사 정보가 따로 관리돼요.</p>
    <template v-if="v.noCompanies"><p style="margin: 0; font-size: 14px; color: #4B5563">등록된 업체가 없어요. 아래에서 업체를 추가해 주세요.</p></template>
    <template v-for="(c, $index) in v.companyCards" :key="$index">
      <button type="button" @click="c.pick" style="display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 16px; border: 1px solid #D1D5DB; border-radius: 16px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: #1E4FD8; color: #FFFFFF; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">{{ c.initial }}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 17px; font-weight: 800; color: #111827">{{ c.name }}</span>
          <span style="font-size: 13px; color: #4B5563">{{ c.camp }} · 기사 {{ c.total }}명</span>
          <template v-if="c.hasPending"><span style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #92400E; background: #FEF3C7; padding: 2px 8px; border-radius: 8px">승인 대기 {{ c.pending }}명</span></template>
        </span>
        <span style="font-size: 22px; color: #4B5563">›</span>
      </button>
    </template>
    <button type="button" @click="v.openAddCo" style="min-height: 56px; border: 1px dashed #9CA3AF; border-radius: 16px; background: #FFFFFF; color: #374151; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">+ 업체 추가</button>
    <template v-if="v.addCoOpen"><div style="display: flex; gap: 8px"><input aria-label="새 업체 이름" :value="v.addCoName" @input="v.onAddCo" placeholder="업체 이름" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px"><button type="button" @click="v.saveCo" style="min-height: 48px; padding: 0 18px; border: none; border-radius: 12px; background: #1E4FD8; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">추가</button></div></template>
    <div style="flex: 1"></div>
    <button type="button" @click="v.logout" style="min-height: 44px; border: none; background: transparent; color: #374151; font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer">로그아웃</button>
  </div>
</template>


<template v-if="v.isApp">
  <div style="height: 100dvh; display: flex; flex-direction: column">
    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; color: #1E4FD8">{{ v.scopeName }}</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 800">{{ v.headerTitle }}</h1>
      </div>
      <template v-if="v.isAdminRole">
        <button type="button" @click="v.goPick" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid #D1D5DB; border-radius: 22px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; color: #111827; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"></path></svg>
          업체 변경
        </button>
      </template>
      <template v-if="v.isDriverRole">
        <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 12px; background: #E0E7FF; color: #1E3A8A">{{ v.me.name }} 기사</span>
      </template>
    </div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 20px 24px">

      
      <template v-if="v.dHome">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <template v-if="v.me.pending">
            <div style="background: #FEF3C7; border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #78350F; font-weight: 500">관리자 승인 대기 중이에요. 승인되면 알림으로 알려드릴게요.</div>
          </template>
          <span style="font-size: 15px; color: #374151">{{ v.me.name }} 기사님, 안녕하세요</span>
          <template v-if="v.me.rd.approved">

        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="ls-memo" style="font-size: 13px; font-weight: 700; color: #374151">메모 (선택)</label>
        <input id="ls-memo" type="text" :value="v.leaseForm.memo" @input="v.onLease.memo" placeholder="예: 12월분 넘버 임대료입니다" style="min-height: 46px; box-sizing: border-box; border: 1px solid #D1D5DB; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 15px">

        <button type="button" @click="v.closeLease" style="flex: 1; min-height: 50px; border: 1px solid #D1D5DB; border-radius: 14px; background: #FFFFFF; color: #374151; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">취소</button>
        <button type="button" @click="v.sendLease" style="flex: 2; min-height: 50px; border: none; border-radius: 14px; background: #111827; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">임대료 안내 보내기</button>

      <div style="display: flex; align-items: center; gap: 8px"><input id="nt-m" type="checkbox" :checked="v.noticeForm.must" @change="v.onNotice.must" style="width: 22px; height: 22px"><label for="nt-m" style="font-size: 15px">필독 (기사님 확인 받기)</label></div>

<template v-if="v.busy"><div role="status" style="position: absolute; inset: 0; background: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #1E4FD8">처리 중…</div></template>

<template v-if="v.hasToast">
  <div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 96px; background: #111827; color: #FFFFFF; border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 500; text-align: center">{{ v.toast }}</div>
</template>
</div>
</script>
<script>
// ===== 진양로지스틱스 기사앱 · 데이터 로직 (Supabase 저장/불러오기) =====
var SB_URL = 'https://wairssqlnegtjehgvslc.supabase.co';
var SB_KEY = 'sb_publishable_B8tJxEG2c5xcqshw907SBg_72MYP435'; // 공개용 키(만료 없음). 실제 접근 범위는 DB 보안 규칙(RLS)이 제한
var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
var BUCKET = 'driver-docs';

var DOCS = [
  { k: 'license', label: '운전면허증' },
  { k: 'cargo', label: '화물운송자격증' },
  { k: 'car', label: '차량등록증' },
  { k: 'biz', label: '사업자등록증' }
];
var ICONS = {
  home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',
  notice: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4',
  pay: 'M3 6h18v14H3zM3 10h18M16 15h.01',
  teams: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7a5 5 0 1 0 0 10a5 5 0 1 0 0-10M12 12h.01',
  me: 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8M4 21c0-4 4-6 8-6s8 2 8 6',
  settings: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1'
};

// ---------- 작은 도우미 ----------
function won(n) { return Number(n || 0).toLocaleString('ko-KR'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function today0() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function eom() { var t = today0(); return new Date(t.getFullYear(), t.getMonth() + 1, 0); }
function parseD(s) { if (!s) return null; var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmtDate(d) { return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' (' + '일월화수목금토'.charAt(d.getDay()) + ')'; }
function fmtShort(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
function fmtWhen(ts) {
  var d = new Date(ts), t = today0(), day = new Date(d); day.setHours(0, 0, 0, 0);
  var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  var diff = Math.round((t - day) / 86400000);
  return diff === 0 ? '오늘 ' + hm : (diff === 1 ? '어제 ' + hm : fmtShort(d) + ' ' + hm);
}
function digits(s) { return String(s || '').replace(/\D/g, ''); }
function fmtPhone(s) { var d = digits(s); return d.length === 11 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7) : (d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : s); }
function loginEmail(phone) { return digits(phone) + '@jinyang.app'; }
function mask(r) { return r ? r.slice(0, 8) + '******' : '미입력'; }
function monthLabel(m) { if (!m) return ''; var p = m.split('-'); return p[0] + '년 ' + (+p[1]) + '월 정산'; }

function reduceView(rd) {
  var v = { has: false, pending: false, approved: false, needAck: false, statusText: '', reqText: '', startText: '—', endText: '', periodText: '', dday: '', reqShort: '', endShort: '', progress: '', barStyle: { width: '0%', height: '8px' } };
  if (!rd) return v;
  var req = parseD(rd.requested_at), t = today0();
  v.has = true; v.pending = rd.status === '요청'; v.approved = rd.status === '승인';
  v.needAck = v.approved && !rd.ack;
  v.statusText = v.pending ? '관리자 승인 대기' : (v.approved ? '승인 완료' : '반려됨');
  v.reqText = fmtDate(req); v.reqShort = fmtShort(req);
  if (v.approved) {
    var st = parseD(rd.approved_at), en = addDays(st, 60);
    var left = Math.round((en - t) / 86400000);
    var dayN = Math.min(60, Math.max(1, Math.round((t - st) / 86400000) + 1));
    v.startText = fmtDate(st); v.endText = fmtDate(en); v.endShort = fmtShort(en);
    v.periodText = fmtDate(st) + ' ~ ' + fmtDate(en);
    v.dday = left > 0 ? 'D-' + left : (left === 0 ? 'D-DAY' : '완료');
    v.progress = '60일 중 ' + dayN + '일째';
    v.barStyle = { width: Math.round(dayN * 100 / 60) + '%', height: '8px', background: '#EA580C' };
  } else if (v.pending) {
    var ex = addDays(t, 60);
    v.startText = '승인 전'; v.endShort = fmtShort(ex);
    v.endText = '승인일 +60일 (오늘 승인 시 ' + fmtDate(ex) + ')';
    v.periodText = '승인일부터 60일 (승인 후 확정)'; v.dday = '승인 대기';
  } else { v.periodText = '반려되어 의무 근무 기간이 없어요'; v.dday = '반려'; }
  return v;
}
function leaseView(l) {
  if (!l) return { amountText: '', dueText: '', status: '', month: '', memo: '', canPay: false, statusStyle: {} };
  var d = parseD(l.due);
  return { amountText: won(l.amount), dueText: fmtDate(d), status: l.status, month: (d.getMonth() + 1) + '월', memo: l.memo || '', canPay: l.status === '납부 대기',
    statusStyle: { fontSize: '14px', fontWeight: 700, color: l.status === '납부 대기' ? '#B45309' : (l.status === '납부 완료' ? '#15803D' : '#1E4FD8') } };
}

// ---------- 앱 상태 ----------
function emptyForm() { return { name: '', rrn1: '', rrn2: '', phone: '', pw: '', pw2: '', sub: '', addr: '', center: '', centerName: '', docs: { license: null, cargo: null, car: null, biz: null } }; }
var FILES = {}; // 가입 중 고른 사진 파일 (화면 상태와 분리)

var S = Vue.reactive({
  screen: 'boot', role: 'driver', uid: null, tab: 'home', busy: false, toast: '',
  login: { phone: '', pw: '' }, loginErr: '',
  adminForm: { name: '', phone: '', pw: '', pw2: '' }, adminErr: '',
  step: 1, err: '', form: emptyForm(),
  companies: [], company: null,
  drivers: [], rrn: {}, docs: {}, urls: {}, notices: [], myReads: {}, nstats: {}, teams: [], payslips: [], reduces: [], leases: [],
  adminView: 'menu', selId: null, search: '', showRrn: false, editMe: false, pushOn: true,
  reduceOpen: false, leaseOpen: false, leaseErr: '', leaseForm: { driverId: null, amount: '', due: iso(eom()), memo: '' },
  noticeOpen: false, noticeErr: '', noticeForm: { tag: '일반', title: '', body: '', must: false },
  addCoOpen: false, addCoName: ''
});
var toastTimer = null;
function flash(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function () { S.toast = ''; }, 2600); }
function fail(e, fallback) { console.error(e); flash(fallback || '문제가 생겼어요. 잠시 후 다시 시도해 주세요'); }
async function run(fn) { if (S.busy) return; S.busy = true; try { await fn(); } finally { S.busy = false; } }

// ---------- 데이터 불러오기 ----------
async function q(p) { var r = await p; if (r.error) throw r.error; return r.data; }

async function loadAll() {
  var admin = S.role === 'admin';
  S.companies = await q(sb.from('companies').select('*').order('created_at'));
  var res = await Promise.all([
    q(sb.from('drivers').select('*').order('created_at')),
    q(sb.from('driver_private').select('*')),
    q(sb.from('driver_docs').select('*')),
    q(sb.from('notices').select('*').order('created_at', { ascending: false })),
    admin ? Promise.resolve([]) : q(sb.from('notice_reads').select('notice_id').eq('driver_id', S.uid)),
    q(sb.from('teams_messages').select('*').order('created_at', { ascending: false }).limit(50)),
    q(sb.from('payslips').select('*').order('month', { ascending: false })),
    q(sb.from('reduce_requests').select('*').order('created_at', { ascending: false })),
    q(sb.from('leases').select('*').order('created_at', { ascending: false }))
  ]);
  S.drivers = res[0];
  var rrn = {}; res[1].forEach(function (r) { rrn[r.driver_id] = r.rrn; }); S.rrn = rrn;
  var docs = {}; res[2].forEach(function (r) { (docs[r.driver_id] = docs[r.driver_id] || {})[r.kind] = r.path; }); S.docs = docs;
  S.notices = res[3];
  var mr = {}; res[4].forEach(function (r) { mr[r.notice_id] = true; }); S.myReads = mr;
  S.teams = res[5]; S.payslips = res[6]; S.reduces = res[7]; S.leases = res[8];
  await refreshUrls();
  await refreshStats();
}
async function refreshUrls() {
  var paths = [];
  Object.keys(S.docs).forEach(function (id) { Object.keys(S.docs[id]).forEach(function (k) { paths.push(S.docs[id][k]); }); });
  if (!paths.length) return;
  var r = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 6);
  if (r.error) return console.error(r.error);
  var u = Object.assign({}, S.urls); r.data.forEach(function (x) { if (x.signedUrl) u[x.path] = x.signedUrl; }); S.urls = u;
}
async function refreshStats() {
  var must = S.notices.filter(function (n) { return n.must; });
  var st = {};
  await Promise.all(must.map(async function (n) {
    var r = await sb.rpc('notice_stats', { p_notice: n.id });
    if (!r.error && r.data && r.data[0]) st[n.id] = r.data[0];
  }));
  S.nstats = st;
}

// ---------- 로그인 흐름 ----------
async function afterAuth(user) {
  S.uid = user.id;
  var a = await sb.from('admins').select('user_id').eq('user_id', user.id).maybeSingle();
  S.role = a.data ? 'admin' : 'driver';
  await loadAll();
  if (S.role === 'admin') { S.screen = 'pick'; }
  else {
    if (!S.drivers.find(function (d) { return d.id === user.id; })) { await sb.auth.signOut(); S.screen = 'login'; S.loginErr = '기사 정보가 없는 계정이에요. 관리자에게 문의해 주세요'; return; }
    S.screen = 'app'; S.tab = 'home';
  }
}
async function boot() {
  try {
    var r = await sb.auth.getSession();
    if (r.data && r.data.session) await afterAuth(r.data.session.user);
    else S.screen = 'login';
  } catch (e) { console.error(e); S.screen = 'login'; }
}

async function uploadDoc(uid, kind, file) {
  var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  var path = uid + '/' + kind + '-' + Date.now() + '.' + ext;
  var up = await sb.storage.from(BUCKET).upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
  if (up.error) throw up.error;
  await q(sb.from('driver_docs').upsert({ driver_id: uid, kind: kind, path: path, uploaded_at: new Date().toISOString() }));
  return path;
}

// ---------- 화면에 넘길 값 ----------
function companyName(id) { var c = S.companies.find(function (x) { return x.id === id; }); return c ? c.name : '미지정'; }
function latestReduce(id) { return S.reduces.find(function (r) { return r.driver_id === id && r.status !== '반려'; }) || S.reduces.find(function (r) { return r.driver_id === id; }) || null; }
function latestLease(id) { return S.leases.find(function (l) { return l.driver_id === id; }) || null; }
function docCount(id) { var d = S.docs[id] || {}; return DOCS.filter(function (x) { return !!d[x.k]; }).length; }

function viewDriver(d) {
  var n = docCount(d.id), r = S.rrn[d.id] || '';
  return { id: d.id, name: d.name, initial: (d.name || '?').charAt(0), center: companyName(d.company_id), status: d.status,
    pending: d.status === '승인 대기', phone: d.phone, sub: d.sub_phone, addr: d.address,
    subText: d.sub_phone || '없음', addrText: d.address || '미입력',
    rrnShown: S.showRrn ? (r || '미입력') : mask(r), docText: n + '/4 제출', rd: reduceView(latestReduce(d.id)) };
}
function docItems(docsMap, prefix, onSet) {
  return DOCS.map(function (d) {
    var v = docsMap[d.k];
    var isBlob = typeof v === 'string' && v.indexOf('blob:') === 0;
    var url = isBlob ? v : (v ? S.urls[v] || '' : '');
    return {
      label: d.label, none: !v, isUrl: !!url, isSample: !!v && !url, url: url,
      inputId: 'file-' + prefix + '-' + d.k, btn: v ? '다시 첨부' : '사진 첨부', status: v ? '첨부됨' : '미첨부',
      statusStyle: { fontSize: '12px', fontWeight: 700, color: v ? '#15803D' : '#B91C1C' },
      onFile: onSet ? function (e) { var f = e && e.target && e.target.files && e.target.files[0]; if (f) onSet(d.k, f); e.target.value = ''; } : null
    };
  });
}
function rowOf(d) {
  var n = docCount(d.id), rr = latestReduce(d.id);
  return {
    name: d.name, initial: (d.name || '?').charAt(0), phone: d.phone,
    pending: d.status === '승인 대기', reduce: !!rr && rr.status === '요청',
    docText: '서류 ' + n + '/4', docStyle: { fontSize: '12px', fontWeight: 700, color: n === 4 ? '#15803D' : '#B91C1C' },
    open: function () { S.tab = 'settings'; S.adminView = 'detail'; S.selId = d.id; S.showRrn = false; }
  };
}
function payView(p) {
  if (!p) return null;
  var items = (Array.isArray(p.items) ? p.items : []).map(function (it) {
    var a = Number(it.amount || 0);
    return { label: it.label, amountText: (a < 0 ? '− ' : '') + won(Math.abs(a)),
      style: { display: 'flex', justifyContent: 'space-between', fontSize: '14px', color: a < 0 ? '#B91C1C' : '#111827' } };
  });

function build() {

    submitReduce: function () {
      run(async function () {
        try { await q(sb.from('reduce_requests').insert({ driver_id: meD.id, company_id: meD.company_id, requested_at: iso(today0()) })); S.reduceOpen = false; await loadAll(); flash('감차 요청 접수 · 승인되면 그날부터 60일 카운트돼요'); }
        catch (e) { fail(e, '감차 요청을 보내지 못했어요'); }
      });
    },
    ackReduce: function () {
      run(async function () {
        try { await q(sb.from('reduce_requests').update({ ack: true }).eq('id', meRd.id)); await loadAll(); flash('확인했어요'); } catch (e) { fail(e); }
      });
    },

    // 관리자: 기사 상세
    search: s.search, onSearch: function (e) { S.search = e.target.value; },
    sel: sel ? viewDriver(sel) : { name: '', initial: '', center: '', status: '', pending: false, phone: '', subText: '', addrText: '', rrnShown: '', docText: '', rd: reduceView(null) },
    selDocs: sel ? docItems(s.docs[sel.id] || {}, 'sel', null) : [],
    approve: function () {
      run(async function () {
        try { await q(sb.from('drivers').update({ status: '활성' }).eq('id', sel.id)); await loadAll(); flash(sel.name + ' 기사 가입을 승인했어요'); } catch (e) { fail(e); }
      });
    },
    requestDocs: function () { flash('서류 보완 요청 알림은 푸시 기능 연결 후 동작해요'); },
    approveReduce: function () {
      var r = latestReduce(sel.id);
      run(async function () {
        try { await q(sb.from('reduce_requests').update({ status: '승인', approved_at: iso(today0()), ack: false }).eq('id', r.id)); await loadAll(); flash(sel.name + ' 기사 감차 승인 · 오늘부터 60일 카운트 시작'); } catch (e) { fail(e); }
      });
    },
    rejectReduce: function () {
      var r = latestReduce(sel.id);
      run(async function () {
        try { await q(sb.from('reduce_requests').update({ status: '반려' }).eq('id', r.id)); await loadAll(); flash(sel.name + ' 기사 감차 요청을 반려했어요'); } catch (e) { fail(e); }
      });
    },

    hasToast: !!s.toast, toast: s.toast
  };
}

Vue.createApp({
  template: '#tpl',
  setup: function () {
    var v = Vue.computed(build);
    Vue.onMounted(boot);
    return { v: v };
  }
}).mount('#app');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
